name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo test --no-default-features
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  wasm:
    name: npm package (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - run: cargo clippy -p collect-settings-wasm --target wasm32-unknown-unknown -- -D warnings
      - run: ./bindings/js/build.sh
      - run: node bindings/js/test.mjs
      - name: Validate npm tarball (no registry check)
        run: cd bindings/js/pkg && npm pack --dry-run
