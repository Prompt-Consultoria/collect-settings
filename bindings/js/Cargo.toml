[package]
name = "collect-settings-wasm"
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "ODK Collect / KoboCollect configuration QR codes in the browser or Node (WebAssembly)"
repository = "https://github.com/Prompt-Consultoria/collect-settings"
homepage = "https://github.com/Prompt-Consultoria/collect-settings"
publish = false # npm package `collect-settings`; not a crates.io crate

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
collect-settings = { path = "../..", version = "0.1.1" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
